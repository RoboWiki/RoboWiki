[project]
name = "robowiki-data"
version = "0.1.0"
description = "RoboWiki 数据仓：面向机器人制作全流程的可追溯工程知识库，承载部件、整机、材料、工艺、软件、渠道与图片来源"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "zeitvex" }]
keywords = ["robotics", "actuator", "quadruped", "catalog", "open-data"]

dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
]
tools = [
    "pillow>=10",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://robowiki.org.cn/"
Repository = "https://github.com/RoboWiki/RoboWiki"
Issues = "https://github.com/RoboWiki/RoboWiki/issues"

[project.scripts]
robowiki-data = "pipeline.__main__:main"

[tool.setuptools]
# 只打包 pipeline；data/assets/schema 是数据，不是 Python 包。
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
